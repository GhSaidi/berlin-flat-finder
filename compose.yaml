services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: flats
    ports:
      - "5432:5432"   # change to "5433:5432" if 5432 is already used on your laptop
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
