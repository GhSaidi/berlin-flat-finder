services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: flats
    ports:
      - "127.0.0.1:5432:5432"   # local only; use "127.0.0.1:5433:5432" if 5432 is already used
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
